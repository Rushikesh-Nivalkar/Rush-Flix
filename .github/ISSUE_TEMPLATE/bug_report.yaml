name: Bug Report
description: Something in Rush Flix isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit:** check the [Troubleshooting](https://github.com/Rushikesh-Nivalkar/Rush-Flix#troubleshooting) section of the README — common setup and install problems are answered there.
        You can also send feedback from inside the app: **Settings → Feedback**.
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please confirm the following.
      options:
        - label: I'm on the [latest release of Rush Flix](https://github.com/Rushikesh-Nivalkar/Rush-Flix/releases/latest) (Settings → Playback → Check for updates).
          required: true
        - label: I [searched the existing issues](https://github.com/Rushikesh-Nivalkar/Rush-Flix/issues?q=is%3Aissue) and didn't find this bug.
          required: true
        - label: This issue describes only one bug.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and the steps to reproduce it.
      placeholder: |
        1. Open '...'
        2. Press '...' on the remote
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Type of problem
      multiple: true
      options:
        - a movie / show won't play
        - remote / D-pad control not working
        - ads or pop-ups appearing
        - app crashes or closes
        - setup / TMDB token problem
        - update / install problem
        - Live TV problem
        - lost data (profiles, history, watchlist)
        - visual / layout problem
        - other
    validations:
      required: true
  - type: input
    attributes:
      label: Rush Flix version
      description: Shown in Settings → Playback.
      placeholder: v2.7.3
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Device
      options:
        - Android TV / Google TV
        - Chromecast with Google TV
        - Nvidia Shield
        - Android phone
        - LG Smart TV (webOS)
        - Fire TV
        - other
    validations:
      required: true
  - type: input
    attributes:
      label: Device model
      description: Brand and model, e.g. "Sony Bravia XR-55A80L", "TCL 55C745", "LG OLED55C3".
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: A phone photo of the TV screen is fine.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: The title you were trying to watch, when it started happening, etc.
