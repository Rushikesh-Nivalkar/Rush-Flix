name: Feature Request
description: Suggest an idea for Rush Flix
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! You can also send suggestions from inside the app: **Settings → Feedback**.

  - type: checkboxes
    attributes:
      label: Guidelines
      options:
        - label: I [searched the existing issues](https://github.com/Rushikesh-Nivalkar/Rush-Flix/issues?q=is%3Aissue) and found no similar request.
          required: true
        - label: This issue contains only one feature request.
          required: true

  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature and what problem it solves for you.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      multiple: true
      options:
        - browsing / search
        - playback / player
        - remote control
        - profiles / library
        - Live TV
        - setup / settings
        - LG webOS
        - other
    validations:
      required: true

  - type: input
    attributes:
      label: Rush Flix version
      description: Shown in Settings → Playback.
      placeholder: v2.7.3
    validations:
      required: false

  - type: upload
    attributes:
      label: Screenshots / mockups
      description: Optional, but helps explain the idea.
    validations:
      required: false
